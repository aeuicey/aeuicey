<svg xmlns="http://www.w3.org/2000/svg" width="495" height="200" viewBox="0 0 495 200">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF5F9"/>
      <stop offset="1" stop-color="#FFE8F1"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="493" height="198" rx="14" fill="url(#bg2)" stroke="#F9C5D5" stroke-width="2"/>

  <text x="24" y="38" font-family="Verdana, sans-serif" font-size="18" font-weight="bold" fill="#EC4899">🧁 Most Used Languages</text>
  <line x1="24" y1="52" x2="471" y2="52" stroke="#F9C5D5" stroke-width="1.5"/>

  <!-- 条形图: 基于 64 个仓库的语言占比(有语言的仓库33个) -->
  <!-- HTML 8 24.2% -->
  <text x="24" y="78" font-family="Verdana, sans-serif" font-size="12" fill="#374151">HTML</text>
  <rect x="100" y="67" width="324" height="14" rx="7" fill="#F3F4F6"/>
  <rect x="100" y="67" width="324" height="14" rx="7" fill="#E34C26"/>
  <text x="471" y="78" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#EC4899" text-anchor="end">24.2%</text>

  <!-- Python 5 15.2% -->
  <text x="24" y="106" font-family="Verdana, sans-serif" font-size="12" fill="#374151">Python</text>
  <rect x="100" y="95" width="324" height="14" rx="7" fill="#F3F4F6"/>
  <rect x="100" y="95" width="204" height="14" rx="7" fill="#3572A5"/>
  <text x="471" y="106" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#EC4899" text-anchor="end">15.2%</text>

  <!-- TypeScript 3 9.1% -->
  <text x="24" y="134" font-family="Verdana, sans-serif" font-size="12" fill="#374151">TypeScript</text>
  <rect x="100" y="123" width="324" height="14" rx="7" fill="#F3F4F6"/>
  <rect x="100" y="123" width="122" height="14" rx="7" fill="#3178C6"/>
  <text x="471" y="134" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#EC4899" text-anchor="end">9.1%</text>

  <!-- JavaScript 3 9.1% -->
  <text x="24" y="162" font-family="Verdana, sans-serif" font-size="12" fill="#374151">JavaScript</text>
  <rect x="100" y="151" width="324" height="14" rx="7" fill="#F3F4F6"/>
  <rect x="100" y="151" width="122" height="14" rx="7" fill="#F1E05A"/>
  <text x="471" y="162" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#EC4899" text-anchor="end">9.1%</text>

  <text x="24" y="188" font-family="Verdana, sans-serif" font-size="11" fill="#F9A8D4">另有 Vue · C# · C++ · Java · CSS · Lua · Swift · Kotlin · Dart 等 🎀</text>
</svg>
